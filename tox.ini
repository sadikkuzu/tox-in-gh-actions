[tox]
envlist =
    py3{11,12,13,14,15}
    pre-commit
skipsdist = true

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314, pre-commit
    3.15: py315

[testenv]
deps =
    pytest-cov
commands =
    pytest --cov=.

[testenv:pre-commit]
skip_install = true
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure --color=always
